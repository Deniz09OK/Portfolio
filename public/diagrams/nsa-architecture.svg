<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-label="Architecture réseau NSA : une passerelle OpenBSD à quatre interfaces segmente trois réseaux privés (administration, serveurs, employés) derrière un filtre de paquets, avec un serveur web FreeBSD exposé uniquement au réseau serveurs.">
  <rect width="1040" height="700" fill="#0c0c10"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8c4b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1ea662"/>
    </marker>
  </defs>

  <text x="520" y="36" text-anchor="middle" fill="#f1ede2" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">NSA — Passerelle et segmentation réseau</text>
  <text x="520" y="58" text-anchor="middle" fill="#868893" font-family="JetBrains Mono, monospace" font-size="12">Schéma d'architecture anonymisé — aucune IP, nom d'hôte ni identifiant réels</text>

  <!-- Internet -->
  <rect x="40" y="280" width="110" height="44" rx="8" fill="#1a1a23" stroke="#868893"/>
  <text x="95" y="307" text-anchor="middle" fill="#c8c4b8" font-family="JetBrains Mono, monospace" font-size="12">INTERNET</text>

  <!-- Gateway -->
  <rect x="220" y="250" width="200" height="104" rx="10" fill="#2a1118" stroke="#e63946" stroke-width="1.5"/>
  <text x="320" y="280" text-anchor="middle" fill="#f1ede2" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700">Passerelle</text>
  <text x="320" y="298" text-anchor="middle" fill="#f1ede2" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700">(OpenBSD, 4 interfaces)</text>
  <text x="320" y="320" text-anchor="middle" fill="#e63946" font-family="JetBrains Mono, monospace" font-size="10.5">filtre de paquets</text>
  <text x="320" y="336" text-anchor="middle" fill="#e63946" font-family="JetBrains Mono, monospace" font-size="10.5">DHCP + DNS internes</text>

  <line x1="150" y1="302" x2="220" y2="302" stroke="#868893" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 3 LANs -->
  <rect x="620" y="90" width="200" height="90" rx="10" fill="#14141b" stroke="#1ea662" stroke-width="1.5"/>
  <text x="720" y="116" text-anchor="middle" fill="#1ea662" font-family="Space Grotesk, sans-serif" font-size="12.5" font-weight="700">LAN 1 — Administration</text>
  <rect x="650" y="130" width="140" height="34" rx="6" fill="#1a1a23" stroke="#353846"/>
  <text x="720" y="152" text-anchor="middle" fill="#f1ede2" font-family="JetBrains Mono, monospace" font-size="10.5">Poste admin</text>

  <rect x="620" y="260" width="200" height="104" rx="10" fill="#14141b" stroke="#f4c542" stroke-width="1.5"/>
  <text x="720" y="286" text-anchor="middle" fill="#f4c542" font-family="Space Grotesk, sans-serif" font-size="12.5" font-weight="700">LAN 2 — Serveurs</text>
  <rect x="640" y="300" width="160" height="48" rx="6" fill="#1a1a23" stroke="#353846"/>
  <text x="720" y="320" text-anchor="middle" fill="#f1ede2" font-family="JetBrains Mono, monospace" font-size="10.5">FreeBSD</text>
  <text x="720" y="335" text-anchor="middle" fill="#868893" font-family="JetBrains Mono, monospace" font-size="9.5">NGINX + MySQL</text>

  <rect x="620" y="430" width="200" height="90" rx="10" fill="#14141b" stroke="#353846" stroke-width="1.5"/>
  <text x="720" y="456" text-anchor="middle" fill="#c8c4b8" font-family="Space Grotesk, sans-serif" font-size="12.5" font-weight="700">LAN 3 — Employés</text>
  <rect x="650" y="470" width="140" height="34" rx="6" fill="#1a1a23" stroke="#353846"/>
  <text x="720" y="492" text-anchor="middle" fill="#f1ede2" font-family="JetBrains Mono, monospace" font-size="10.5">Poste employé</text>

  <!-- Gateway to LANs -->
  <line x1="420" y1="270" x2="620" y2="150" stroke="#1ea662" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="420" y1="302" x2="620" y2="312" stroke="#f4c542" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="420" y1="334" x2="620" y2="475" stroke="#868893" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Packet filter rules (full-width band, clear of every box above) -->
  <rect x="40" y="560" width="960" height="110" rx="10" fill="#14141b" stroke="#353846" stroke-width="1.5"/>
  <text x="60" y="586" fill="#f1ede2" font-family="Space Grotesk, sans-serif" font-size="12.5" font-weight="700">Règles du filtre de paquets</text>
  <text x="60" y="608" fill="#1ea662" font-family="JetBrains Mono, monospace" font-size="11">Admin → Serveurs : tous ports</text>
  <text x="60" y="628" fill="#f4c542" font-family="JetBrains Mono, monospace" font-size="11">Employés → Serveurs : HTTP/HTTPS seulement</text>
  <text x="520" y="608" fill="#868893" font-family="JetBrains Mono, monospace" font-size="11">Tous → Internet, DNS, DHCP via la passerelle</text>
  <text x="520" y="628" fill="#868893" font-family="JetBrains Mono, monospace" font-size="11">Aucune communication directe inter-LAN hors passerelle</text>

  <text x="520" y="690" text-anchor="middle" fill="#868893" font-family="Space Grotesk, sans-serif" font-size="11">Masques de sous-réseau calculés par segment · DHCP/DNS internes · pas d'accès direct entre LAN</text>
</svg>

name: Test & deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only by default: the test job also runs on pull requests.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bloque le déploiement si une dépendance a une vulnérabilité haute ou critique connue.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # eslint.config.mjs imports .nuxt/eslint.config.mjs, written by `nuxt prepare` (the postinstall of npm ci).
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # No secrets in this job: the HTB token only lives in htb-sync.yml. A NUXT_PUBLIC_* variable
      # passed here would be written into the public JS bundle.
      - name: Generate static site
        run: npm run generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # The tested build is the one that gets deployed. The artifact is built on every run, pull requests
      # included, so that the check below catches a regression (e.g. an action update) before it reaches main;
      # only the deploy job, still limited to main, publishes it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/public
          # Depuis la v4, l'action exclut les fichiers et dossiers cachés : sans cette option, .well-known/
          # (security.txt) n'est pas publié. .git et .github restent exclus dans tous les cas.
          include-hidden-files: true

      # Checks the artifact that will really be published, not just .output/public.
      - name: Download the Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      - name: Check the Pages artifact
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pages-artifact/artifact.tar"
          tar -tf "$archive" | sed 's#^\./##' > "$RUNNER_TEMP/pages-files.txt"
          for f in index.html en/index.html tr/index.html 404.html sitemap.xml robots.txt .well-known/security.txt; do
            grep -qx "$f" "$RUNNER_TEMP/pages-files.txt" || { echo "::error::$f absent de l'artefact publié"; exit 1; }
          done
          # Seul .well-known/ peut être caché : tout autre fichier caché serait publié sans qu'on le voie.
          hidden=$(grep -E '(^|/)\.[^/]' "$RUNNER_TEMP/pages-files.txt" | grep -v '^\.well-known/' || true)
          [ -z "$hidden" ] || { echo "::error::fichiers cachés inattendus dans l'artefact : $hidden"; exit 1; }
          # Le security.txt publié est bien celui du dépôt.
          tar -xOf "$archive" ./.well-known/security.txt | cmp - public/.well-known/security.txt
          echo "Artefact Pages vérifié : $(wc -l < "$RUNNER_TEMP/pages-files.txt") entrées, .well-known/security.txt présent."

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Only the deployment job gets the Pages permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Crée un tag semver sur le commit déployé. Ne pousse QUE le tag : aucun commit, car htb-sync.yml
  # commite sur main dès que les stats Hack The Box changent et un commit de ce job provoquerait des conflits.
  tag:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Seul ce job peut écrire dans le dépôt (pour pousser le tag).
    permissions:
      contents: write
    # Groupe dédié, sans annulation : deux runs ne calculent pas ni ne poussent un tag en même temps.
    concurrency:
      group: tag-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tag the deployed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          semver_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          breaking_re='^[a-z]+(\([^)]+\))?!:'
          feat_re='^feat(\([^)]+\))?:'
          patch_re='^(fix|perf)(\([^)]+\))?:'

          # Seuls les tags vMAJEUR.MINEUR.PATCH comptent : tout autre tag est ignoré.
          last_tag=$(git tag --list 'v*' --merged "$DEPLOY_SHA" --sort=-v:refname | { grep -E "$semver_re" || true; } | head -n 1)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | { grep -E "$semver_re" || true; } | head -n 1)

          if [ "$last_tag" != "$latest_tag" ]; then
            echo "Le dernier tag semver (${latest_tag:-aucun}) n'est pas dans l'historique de ${DEPLOY_SHA}. Aucun tag créé."
            exit 0
          fi

          if [ -z "$last_tag" ]; then
            new_tag="v0.1.0"
            echo "Aucun tag semver existant : premier tag ${new_tag}."
          else
            # 0 = aucun bump, 1 = patch, 2 = mineur, 3 = majeur
            level=0
            while IFS= read -r commit; do
              subject=$(git log -1 --format=%s "$commit")
              body=$(git log -1 --format=%b "$commit")

              # Les commits automatiques de htb-sync ne déclenchent jamais de tag.
              case "$subject" in
                'chore(htb):'*) continue ;;
              esac

              if [[ "$subject" =~ $breaking_re ]] || printf '%s\n' "$body" | grep -Eq '^BREAKING[ -]CHANGE'; then
                commit_level=3
              elif [[ "$subject" =~ $feat_re ]]; then
                commit_level=2
              elif [[ "$subject" =~ $patch_re ]]; then
                commit_level=1
              else
                commit_level=0
              fi

              if [ "$commit_level" -gt "$level" ]; then
                level=$commit_level
              fi
            done < <(git rev-list "${last_tag}..${DEPLOY_SHA}")

            if [ "$level" -eq 0 ]; then
              echo "Aucun commit feat/fix/perf/breaking depuis ${last_tag} : aucun tag créé."
              exit 0
            fi

            IFS=. read -r major minor patch <<< "${last_tag#v}"
            case "$level" in
              3) major=$((major + 1)); minor=0; patch=0 ;;
              2) minor=$((minor + 1)); patch=0 ;;
              1) patch=$((patch + 1)) ;;
            esac
            new_tag="v${major}.${minor}.${patch}"
            echo "Dernier tag ${last_tag}, nouveau tag ${new_tag}."
          fi

          # Un tag existant n'est jamais déplacé ni supprimé.
          if git rev-parse -q --verify "refs/tags/${new_tag}" > /dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${new_tag}" > /dev/null 2>&1; then
            echo "Le tag ${new_tag} existe déjà : création ignorée."
            exit 0
          fi

          git tag -a "$new_tag" -m "Version ${new_tag#v}" "$DEPLOY_SHA"
          git push origin "refs/tags/${new_tag}"
          echo "Tag ${new_tag} poussé sur ${DEPLOY_SHA}."

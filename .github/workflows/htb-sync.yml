name: htb-sync

# Met à jour public/data/htb.json (API Hack The Box) et public/data/thm.json (API publique TryHackMe,
# sans secret), puis relance le déploiement existant.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    # Les commits automatiques ne touchent que ces fichiers : ils ne relancent donc pas ce workflow en boucle.
    paths-ignore:
      - public/data/htb.json
      - public/data/thm.json

permissions:
  contents: write
  actions: write

concurrency:
  group: htb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Fetch Hack The Box stats
        run: node scripts/fetch-htb.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      # Aucun secret : l'API publique TryHackMe s'interroge sans authentification. Étape indépendante de HTB :
      # elle tourne même si l'étape précédente a échoué.
      - name: Fetch TryHackMe stats
        if: ${{ !cancelled() }}
        run: node scripts/fetch-thm.mjs

      # Un commit par source, avec des messages distincts : le job tag de deploy.yml ignore chore(htb), et
      # chore(thm) n'est de toute façon jamais un bump (type chore).
      - name: Commit the JSON if it changed
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Deniz OK"
          git config user.email "deniz.ok@epitech.eu"
          changed=false
          commit_if_changed() {
            if git diff --quiet -- "$1" && [ -z "$(git ls-files --others --exclude-standard "$1")" ]; then
              echo "$1 inchangé, rien à commiter."
              return 0
            fi
            git add "$1"
            git commit -m "$2"
            changed=true
          }
          commit_if_changed public/data/htb.json "chore(htb): mise à jour des stats Hack The Box [skip ci]"
          commit_if_changed public/data/thm.json "chore(thm): mise à jour des stats TryHackMe [skip ci]"
          if [ "$changed" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche aucun autre workflow : on lance donc le déploiement explicitement.
      - name: Trigger the deployment
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

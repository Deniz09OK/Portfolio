name: htb-sync

# Met à jour public/data/htb.json depuis l'API Hack The Box, puis relance le déploiement existant.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    # Le commit automatique ne touche que ce fichier : il ne relance donc pas ce workflow en boucle.
    paths-ignore:
      - public/data/htb.json

permissions:
  contents: write
  actions: write

concurrency:
  group: htb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Fetch Hack The Box stats
        run: node scripts/fetch-htb.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Commit the JSON if it changed
        id: commit
        run: |
          if git diff --quiet -- public/data/htb.json && [ -z "$(git ls-files --others --exclude-standard public/data/htb.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "htb.json inchangé, rien à commiter."
            exit 0
          fi
          git config user.name "Deniz OK"
          git config user.email "deniz.ok@epitech.eu"
          git add public/data/htb.json
          git commit -m "chore(htb): mise à jour des stats Hack The Box [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche aucun autre workflow : on lance donc le déploiement explicitement.
      - name: Trigger the deployment
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

# Mises à jour hebdomadaires des dépendances npm et des actions GitHub.
# Les actions restent épinglées par SHA : Dependabot met à jour le SHA et le commentaire de version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Toutes les mises à jour minor et patch dans une seule PR par semaine.
      # Les majeures n'entrent dans aucun groupe : chacune garde sa propre PR, pour être relue à part.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # vue-router doit rester en v4 tant que le site est en Nuxt 3 : Nuxt 3 exige vue-router ^4.
      # Une v5 au premier niveau installe une seconde copie que le site n'utilise pas (cf. PR #32).
      # Les mises à jour minor et patch de la v4 restent proposées. À retirer lors du passage à Nuxt 4.
      - dependency-name: vue-router
        update-types:
          - version-update:semver-major
      # @types/node doit suivre la version de Node utilisée en CI (Node 22 dans deploy.yml et htb-sync.yml),
      # sinon les types décrivent des API absentes du runtime (cf. PR #27). Mettre à jour en même temps que Node.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: chore(ci)
    groups:
      # Une seule PR pour toutes les actions, majeures comprises.
      actions:
        patterns:
          - '*'

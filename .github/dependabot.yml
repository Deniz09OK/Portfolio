# Mises à jour hebdomadaires des dépendances npm et des actions GitHub.
# Les actions restent épinglées par SHA : Dependabot met à jour le SHA et le commentaire de version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Toutes les mises à jour minor et patch dans une seule PR par semaine.
      # Les majeures n'entrent dans aucun groupe : chacune garde sa propre PR, pour être relue à part.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: chore(ci)
    groups:
      # Une seule PR pour toutes les actions, majeures comprises.
      actions:
        patterns:
          - '*'
